services:

  # 🔒 Reverse Proxy + SSL
  traefik:
    image: traefik:v3.0
    environment:
      - DOCKER_API_VERSION=1.43
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=your-email@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.useBindPortIP=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: always

  # 🌍 Frontend
  frontend:
    build: ../../services/frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.devindevops.space`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ⚙️ API
  api:
    build: ../../services/api
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      retries: 3
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.devindevops.space`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"

  # 🔁 Workers
  worker-1:
    build: ../../services/worker
    restart: always
    environment:
      - WORKER_NAME=worker-1
      - API_URL=http://api:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      retries: 3
    labels:
      - "autoheal=true"

  worker-2:
    build: ../../services/worker
    restart: always
    environment:
      - WORKER_NAME=worker-2
      - API_URL=http://api:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      retries: 3
    labels:
      - "autoheal=true"

  # 📊 Prometheus
  prometheus:
    image: prom/prometheus
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prom.rule=Host(`prom.devindevops.space`)"
      - "traefik.http.routers.prom.entrypoints=websecure"
      - "traefik.http.routers.prom.tls.certresolver=myresolver"

  # 📈 Grafana
  grafana:
    image: grafana/grafana
    volumes:
      - grafana-data:/var/lib/grafana
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.devindevops.space`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"

  # 📜 Loki
  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: always

  # 📦 Promtail
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: always

  # 🔁 Autoheal
  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  grafana-data:
  prometheus-data:
  loki-data: